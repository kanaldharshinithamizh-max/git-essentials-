<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#171126" />
  <title>Hello Dharshini</title>
  <style>
    :root { --ink: #fffaff; --muted: #d7cce8; --pink: #ff74bc; --gold: #ffd36e; --violet: #8e70ff; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; display: grid; place-items: center; overflow: hidden;
      color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #171126;
    }
    .glow { position: fixed; border-radius: 50%; filter: blur(4px); opacity: .8; pointer-events: none; }
    .glow.one { width: 34rem; height: 34rem; background: #5531c9; top: -17rem; left: -12rem; }
    .glow.two { width: 28rem; height: 28rem; background: #bd2878; bottom: -15rem; right: -10rem; }
    .card {
      position: relative; width: min(90vw, 720px); padding: clamp(2.5rem, 7vw, 5.5rem);
      text-align: center; border: 1px solid rgba(255,255,255,.22); border-radius: 32px;
      background: linear-gradient(135deg, rgba(255,255,255,.16), rgba(255,255,255,.05));
      box-shadow: 0 30px 80px rgba(0,0,0,.35); backdrop-filter: blur(18px);
    }
    .sparkle { color: var(--gold); font-size: 1.8rem; letter-spacing: .45rem; animation: float 2.5s ease-in-out infinite; }
    h1 { margin: .65rem 0 1rem; font-family: Georgia, "Times New Roman", serif; font-size: clamp(3.4rem, 11vw, 6.8rem); line-height: .9; letter-spacing: -.07em; }
    h1 span { display: block; color: var(--pink); text-shadow: 0 0 30px rgba(255,116,188,.35); }
    p { max-width: 430px; margin: 0 auto 2rem; color: var(--muted); font-size: clamp(1rem, 2.6vw, 1.15rem); line-height: 1.7; }
    button {
      border: 0; border-radius: 999px; padding: .9rem 1.35rem; cursor: pointer; color: #26133e;
      background: linear-gradient(100deg, var(--gold), #fff0b8); font: 700 1rem inherit;
      box-shadow: 0 10px 25px rgba(255,211,110,.2); transition: transform .2s, box-shadow .2s;
    }
    button:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 15px 35px rgba(255,211,110,.3); }
    .note { min-height: 1.5rem; margin: 1.3rem 0 -1.5rem; color: #fff0b8; font-size: .94rem; }
    @keyframes float { 50% { transform: translateY(-8px) rotate(8deg); } }
    @media (prefers-reduced-motion: reduce) { .sparkle { animation: none; } }
  </style>
</head>
<body>
  <div class="glow one"></div><div class="glow two"></div>
  <main class="card">
    <div class="sparkle">✦ ✧ ✦</div>
    <h1>Hello, <span>Dharshini.</span></h1>
    <p>A little corner of the internet made especially for you—bright, bold, and full of possibility.</p>
    <button id="magicButton" type="button">Add a little magic ✨</button>
    <div class="note" id="note" aria-live="polite"></div>
  </main>
  <script>
    const messages = ["Today is yours to make wonderful.", "You’ve got this, Dharshini!", "A spark of joy, just for you."];
    let index = 0;
    document.getElementById('magicButton').addEventListener('click', () => {
      document.getElementById('note').textContent = messages[index++ % messages.length];
    });
  </script>
</body>
</html>
